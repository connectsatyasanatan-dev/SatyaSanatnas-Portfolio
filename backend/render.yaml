# render.yaml — Backend deployment config for Render.com
# Docs: https://render.com/docs/render-yaml-spec
#
# Steps to use:
#   1. Push your repo to GitHub
#   2. Go to https://dashboard.render.com → New → Blueprint
#   3. Connect your repo — Render will auto-detect this file
#   4. Set the secret environment variables in the Render dashboard

services:
  - type: web
    name: portfolio-flask-api
    runtime: python
    region: oregon                        # Change to your preferred region
    plan: free                            # Upgrade for production
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /api/health

    envVars:
      # Set these in the Render dashboard — NEVER commit real values here
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true               # Render generates a secure random value
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://your-portfolio.vercel.app   # Update with real Vercel URL
      - key: ADMIN_USERNAME
        sync: false                       # Forces you to set it in the dashboard
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: MAIL_SERVER
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USE_TLS
        value: "true"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_DEFAULT_SENDER
        sync: false
